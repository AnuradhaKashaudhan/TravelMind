[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travelmind-backend"
version = "0.1.0"
description = "TravelMind API foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.110,<1",
    "google-genai>=1.0,<2",
    "langgraph>=0.2,<2",
    "openai>=1.30,<3",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.2,<3",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.1,<26",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<5",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "UP"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
warn_unused_ignores = true

