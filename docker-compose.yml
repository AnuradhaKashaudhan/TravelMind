services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DB_URL: ${DB_URL:-postgresql+asyncpg://travelmind:travelmind@postgres:5432/travelmind}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      FALLBACK_LLM_PROVIDER: ${FALLBACK_LLM_PROVIDER:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      SIMPLE_MODEL: ${SIMPLE_MODEL:-}
      SUPERVISOR_MODEL: ${SUPERVISOR_MODEL:-}
      ITINERARY_MODEL: ${ITINERARY_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-45}
      LLM_RETRIES: ${LLM_RETRIES:-2}
      LLM_RETRY_BASE_S: ${LLM_RETRY_BASE_S:-0.5}
      LLM_INPUT_COST_PER_MILLION_USD: ${LLM_INPUT_COST_PER_MILLION_USD:-0}
      LLM_OUTPUT_COST_PER_MILLION_USD: ${LLM_OUTPUT_COST_PER_MILLION_USD:-0}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      USE_FAKE_PROVIDERS: ${USE_FAKE_PROVIDERS:-false}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      PLACES_CACHE_TTL_S: ${PLACES_CACHE_TTL_S:-86400}
      GEOCODING_CACHE_TTL_S: ${GEOCODING_CACHE_TTL_S:-2592000}
      WEATHER_CACHE_TTL_S: ${WEATHER_CACHE_TTL_S:-3600}
      ROUTES_CACHE_TTL_S: ${ROUTES_CACHE_TTL_S:-21600}
      TOOL_TIMEOUT_S: ${TOOL_TIMEOUT_S:-15}
      TOOL_RETRIES: ${TOOL_RETRIES:-2}
      PROVIDER_RATE_LIMIT_PER_S: ${PROVIDER_RATE_LIMIT_PER_S:-5}
      PROVIDER_RATE_LIMIT_BURST: ${PROVIDER_RATE_LIMIT_BURST:-10}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_RESET_S: ${CIRCUIT_BREAKER_RESET_S:-30}
      FARE_CONFIG_PATH: ${FARE_CONFIG_PATH:-app/tools/fare_estimates.json}
      OPENWEATHER_BASE_URL: ${OPENWEATHER_BASE_URL:-https://api.openweathermap.org/data/2.5}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: travelmind
      POSTGRES_USER: travelmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelmind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_DB: travelmind_test
      POSTGRES_USER: travelmind
      POSTGRES_PASSWORD: travelmind
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  postgres_test_data:
